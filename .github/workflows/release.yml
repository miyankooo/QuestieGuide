name: Package and release

# Runs on version tags. Without CF_API_TOKEN and a toc X-Curse-Project-ID the packager skips the
# CurseForge upload and only publishes the zip as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Full history, so the packager can find the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
